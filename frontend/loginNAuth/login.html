<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VYOM+</title>
    <!-- Tabler Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Theme: apply before paint to prevent flash -->
    <script>
        (function() {
            var t = localStorage.getItem("gst_theme") || "dark";
            if (t === "light") document.documentElement.classList.add("light-mode");
        })();
    </script>
</head>
<body>
    <!-- Dynamic Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Back to Home -->
    <a href="../index.html" class="back-to-home">
        <i class="ti ti-arrow-left"></i> Back to Home
    </a>

    <div class="login-container">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your VYOM+ account</p>
        
        <form id="loginForm">
            <!-- In-page warning banner container -->
            <div id="alert-banner" style="display: none; padding: 12px; border-radius: var(--border-radius-md); background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--color-error); color: var(--color-text-primary); font-size: 13px; margin-bottom: 15px; text-align: center; font-weight: 500;"></div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your registered email" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <button type="submit" id="loginBtn" class="login-button">
                Sign In <i class="ti ti-login"></i>
            </button>
        </form>

        <div class="auth-footer-link">
            Don't have an account? <a href="registration.html">Get Started</a>
        </div>
    </div>

    <!-- Floating Theme Toggle -->
    <button class="floating-theme-toggle theme-toggle-btn" id="auth-theme-toggle" title="Switch Theme">
        <i class="ti ti-sun"></i>
    </button>

    <script src="../console/shared/theme.js"></script>
    <script src="app.js"></script>
</body>
</html>
