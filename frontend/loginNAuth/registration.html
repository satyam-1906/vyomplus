<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VYOM+</title>
    <!-- Tabler Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google Fonts: Kumbh Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Theme: apply before paint to prevent flash -->
    <script>
        (function() {
            var t = localStorage.getItem("gst_theme") || "dark";
            if (t === "light") document.documentElement.classList.add("light-mode");
        })();
    </script>
</head>
<body>
    <!-- Dynamic Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Back to Home -->
    <a href="../index.html" class="back-to-home">
        <i class="ti ti-arrow-left"></i> Back to Home
    </a>

    <div class="registration-container">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Get started with AI-powered GST analytics</p>

        <form id="registrationForm">
            <!-- In-page warning banner container -->
            <div id="alert-banner" style="display: none; padding: 12px; border-radius: var(--border-radius-md); background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--color-error); color: var(--color-text-primary); font-size: 13px; margin-bottom: 15px; text-align: center; font-weight: 500;"></div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    placeholder="Enter your full name" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your business email" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input 
                    type="tel" 
                    id="mobile" 
                    name="mobile" 
                    placeholder="Enter your 10-digit mobile" 
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Create a secure password" 
                    required
                >
                <div class="pwd-strength-container">
                    <div class="pwd-strength-bar" id="strengthBar"></div>
                </div>
                <small class="pwd-strength-text" id="strengthText">Password strength</small>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="consentTos" required>
                <label for="consentTos">I consent to the <a href="#">Terms of Service</a></label>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="consentPrivacy" required>
                <label for="consentPrivacy">I consent to the <a href="#">Privacy Policy</a></label>
            </div>

            <button type="submit" id="registerBtn" class="register-button">
                Register & Verify <i class="ti ti-user-plus"></i>
            </button>
        </form>

        <div class="auth-footer-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- Floating Theme Toggle -->
    <button class="floating-theme-toggle theme-toggle-btn" id="auth-theme-toggle" title="Switch Theme">
        <i class="ti ti-sun"></i>
    </button>

    <script src="../console/shared/theme.js"></script>
    <script src="../console/shared/canvas.js"></script>
    <script src="app.js"></script>
</body>
</html>
