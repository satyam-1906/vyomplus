<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - VYOM+</title>
    <!-- Tabler Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Theme: apply before paint to prevent flash -->
    <script>
        (function() {
            var t = localStorage.getItem("gst_theme") || "dark";
            if (t === "light") document.documentElement.classList.add("light-mode");
        })();
    </script>
</head>
<body>
    <!-- Dynamic Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Back to Home -->
    <a href="../index.html" class="back-to-home">
        <i class="ti ti-arrow-left"></i> Back to Home
    </a>

    <div class="auth-container">
        <h1>Verify OTP</h1>
        <p class="auth-subtitle">Enter the 6-digit verification code sent to your email</p>
        
        <form id="authForm">
            <!-- In-page warning banner container -->
            <div id="alert-banner" style="display: none; padding: 12px; border-radius: var(--border-radius-md); background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--color-error); color: var(--color-text-primary); font-size: 13px; margin-bottom: 15px; text-align: center; font-weight: 500;"></div>

            <div class="otp-inputs-container">
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
                <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" required>
            </div>
            
            <input type="hidden" id="otp" name="otp">

            <button type="submit" id="verifyBtn" class="verify-button">
                Verify OTP <i class="ti ti-shield-check"></i>
            </button>
        </form>

        <div class="auth-footer-link">
            Didn't receive it? <span class="resend-countdown" id="resendTimer">Resend in 60s</span>
            <a href="#" id="resendBtn" style="display: none;">Resend Code</a>
        </div>
    </div>

    <!-- Floating Theme Toggle -->
    <button class="floating-theme-toggle theme-toggle-btn" id="auth-theme-toggle" title="Switch Theme">
        <i class="ti ti-sun"></i>
    </button>

    <script src="../console/shared/theme.js"></script>
    <script src="app.js"></script>
</body>
</html>
